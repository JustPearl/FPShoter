<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northern Outbreak - FPS Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        
        .crosshair-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        
        .crosshair-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%);
        }
        
        .crosshair-line.horizontal {
            width: 20px;
            height: 2px;
        }
        
        .crosshair-line.vertical {
            width: 2px;
            height: 20px;
        }
        
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }
        
        .hud-element {
            margin: 10px 0;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid #4a9eff;
            border-radius: 0 5px 5px 0;
        }
        
        #health-bar {
            width: 200px;
            height: 20px;
            background: rgba(255, 0, 0, 0.3);
            border: 2px solid #ff0000;
            border-radius: 3px;
            overflow: hidden;
        }
        
        #health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6b6b);
            transition: width 0.3s ease;
        }
        
        #ammo-display {
            font-size: 24px;
            font-weight: bold;
        }
        
        #weapon-name {
            font-size: 16px;
            color: #4a9eff;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #start-screen h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
        }
        
        #start-screen p {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 30px;
            max-width: 600px;
            text-align: center;
        }
        
        #start-button {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #4a9eff, #0066cc);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.6);
        }
        
        #instructions {
            color: #aaa;
            font-size: 14px;
            margin-top: 30px;
            text-align: center;
            line-height: 1.6;
        }
        
        .key {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 3px;
            margin: 0 2px;
        }
        
        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 50;
        }
        
        .damage-flash {
            background: radial-gradient(ellipse at center, transparent 0%, rgba(255,0,0,0.3) 100%);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>NORTHERN OUTBREAK</h1>
            <p>A military compound in Sweden has been overrun by undead horrors and demonic entities. Survive the nightmare.</p>
            <button id="start-button">ENTER THE COMPOUND</button>
            <div id="instructions">
                <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move &nbsp;|&nbsp; 
                <span class="key">MOUSE</span> Look &nbsp;|&nbsp; 
                <span class="key">LMB</span> Fire &nbsp;|&nbsp; 
                <span class="key">R</span> Reload &nbsp;|&nbsp; 
                <span class="key">1</span>/<span class="key">2</span> Switch Weapons &nbsp;|&nbsp; 
                <span class="key">SHIFT</span> Sprint
            </div>
        </div>
        
        <div id="crosshair">
            <div class="crosshair-line horizontal"></div>
            <div class="crosshair-line vertical"></div>
            <div class="crosshair-dot"></div>
        </div>
        
        <div id="hud">
            <div class="hud-element">
                <div>HEALTH</div>
                <div id="health-bar"><div id="health-fill"></div></div>
            </div>
            <div class="hud-element">
                <div id="ammo-display">12 / 48</div>
                <div id="weapon-name">.45 PISTOL</div>
            </div>
        </div>
        
        <div id="score-display">
            <div>KILLS: <span id="kill-count">0</span></div>
            <div>WAVE: <span id="wave-count">1</span></div>
        </div>
        
        <div id="damage-overlay" class="damage-flash"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
